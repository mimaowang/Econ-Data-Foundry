name: Validate knowledge base

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quality-gate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: python -m ruff check .
      - name: Scan for committed credentials
        run: python scripts/check_secrets.py
      - name: Validate source records
        run: python scripts/validate_kb.py --write-report
      - name: Rebuild deterministic views
        run: python scripts/build_views.py
      - name: Validate rebuilt views
        run: python scripts/validate_kb.py
      - name: Export public catalog
        run: python scripts/export_catalog.py
      - name: Build static Idea Router
        run: python scripts/build_site.py
      - name: Build quality card
        run: python scripts/build_quality_card.py
      - name: Check generated Markdown drift
        shell: bash
        run: git diff --exit-code -- DATASET_INDEX.md ledgers/aliases.md ledgers/progress.md ledgers/quality-card.md dist docs
      - name: Run regression tests
        run: python -m pytest
